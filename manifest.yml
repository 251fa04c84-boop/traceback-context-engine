modules:
  jira:issueContext:
    - key: traceback-context-panel
      resource: main-ui-kit/entry
      resolver:
        function: resolver
      render: native
      title: TraceBack Context Engine
      description: Evidence-backed incident context for this Jira issue.
      label: Investigate
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main-ui-kit
    path: src/frontend
    entry:
      entry: index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
permissions:
  scopes:
    - read:jira-work
    - read:graph:issue:jira
    - read:graph:deployment:external
    - read:graph:pull-request:external
    - read:graph:goal:atlassian
