name: Forge development deploy

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch containing the TraceBack Forge app
        required: true
        type: string
        default: codegeist/forge-foundation
      accept_forge_terms:
        description: I authorize registering this app and accepting Atlassian Forge CLI terms if no app ID exists yet
        required: true
        type: boolean
        default: false
      confirm_readonly_scopes:
        description: I authorize read-only scopes: read:jira-work, read:graph:issue:jira, read:graph:goal:atlassian, read:graph:deployment:external, and read:graph:pull-request:external
        required: true
        type: boolean
        default: false
      install_mode:
        description: Choose install for first-time installation or upgrade if already installed on this Jira site
        required: true
        type: choice
        options:
          - install
          - upgrade
        default: install
      developer_space_id:
        description: Optional Developer Space ID if your Atlassian account has multiple spaces
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: traceback-forge-development
  cancel-in-progress: false

jobs:
  register-lint-deploy-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      ACCEPT_FORGE_TERMS: ${{ inputs.accept_forge_terms }}
      CONFIRM_READONLY_SCOPES: ${{ inputs.confirm_readonly_scopes }}
      INSTALL_MODE: ${{ inputs.install_mode }}
      DEVELOPER_SPACE_ID: ${{ inputs.developer_space_id }}
    steps:
      - name: Check out the selected app branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_branch }}
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify required secrets and explicit confirmations
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SOURCE_BRANCH" != "codegeist/forge-foundation" ]]; then
            echo "::error title=Unexpected source branch::This deployment workflow is restricted to codegeist/forge-foundation."
            exit 1
          fi
          if [[ -z "$FORGE_EMAIL" || -z "$FORGE_API_TOKEN" ]]; then
            echo "::error title=Forge credentials missing::Add FORGE_EMAIL and FORGE_API_TOKEN as GitHub Actions repository secrets before running this workflow."
            exit 1
          fi
          if [[ "$CONFIRM_READONLY_SCOPES" != "true" ]]; then
            echo "::error title=Scope approval required::Confirm the read-only Jira and Teamwork Graph scopes before installing the app."
            exit 1
          fi

      - name: Install app dependencies
        run: npm install

      - name: Disable interactive Forge CLI analytics prompt
        run: npx --yes @forge/cli@15.1.0 settings set usage-analytics false

      - name: Register the Forge app once if the manifest has no app ID
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^  id:' manifest.yml; then
            echo "An app ID already exists in manifest.yml; skipping registration."
          else
            if [[ "$ACCEPT_FORGE_TERMS" != "true" ]]; then
              echo "::error title=Forge terms confirmation required::The manifest has no app ID. Confirm Atlassian Forge terms before first-time registration."
              exit 1
            fi
            if [[ -n "$DEVELOPER_SPACE_ID" ]]; then
              npx --yes @forge/cli@15.1.0 register "TraceBack Context Engine" --developer-space-id "$DEVELOPER_SPACE_ID" --accept-terms
            else
              npx --yes @forge/cli@15.1.0 register "TraceBack Context Engine" --accept-terms
            fi
            if ! grep -Eq '^  id:' manifest.yml; then
              echo "::error title=Registration did not update manifest::Forge registration returned without writing app.id to manifest.yml."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.yml
            git commit -m "chore: register TraceBack Forge app"
            git push origin "HEAD:$SOURCE_BRANCH"
          fi

      - name: Validate Forge manifest and app source
        run: npx --yes @forge/cli@15.1.0 lint

      - name: Deploy to Forge development environment
        run: npx --yes @forge/cli@15.1.0 deploy --non-interactive -e development

      - name: Install on the development Jira site
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INSTALL_MODE" == "upgrade" ]]; then
            npx --yes @forge/cli@15.1.0 install --site 251fa04c84.atlassian.net --product jira --non-interactive --confirm-scopes --upgrade all -e development
          else
            npx --yes @forge/cli@15.1.0 install --site 251fa04c84.atlassian.net --product jira --non-interactive --confirm-scopes -e development
          fi
