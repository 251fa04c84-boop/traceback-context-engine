name: Forge development deploy (no Jira site install)

on:
  push:
    branches: [main, "codegeist/**"]
    paths:
      - .github/workflows/forge-dev-deploy.yml
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch containing the TraceBack Forge app
        required: true
        type: string
        default: codegeist/forge-foundation
      accept_forge_terms:
        description: I authorize registering this app and accepting Atlassian Forge CLI terms if no app ID exists yet
        required: true
        type: boolean
        default: false
      confirm_no_existing_registration:
        description: I confirm this app has not already been registered outside this workflow; if it has, I will stop and recover its existing app ID
        required: true
        type: boolean
        default: false
      developer_space_id:
        description: Optional Developer Space ID if your Atlassian account has multiple spaces
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: traceback-forge-development
  cancel-in-progress: false

jobs:
  validate-workflow-on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm GitHub accepted the workflow definition
        run: echo "Forge development deployment workflow syntax was accepted by GitHub."

  register-lint-deploy-development:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      ACCEPT_FORGE_TERMS: ${{ inputs.accept_forge_terms }}
      CONFIRM_NO_EXISTING_REGISTRATION: ${{ inputs.confirm_no_existing_registration }}
      DEVELOPER_SPACE_ID: ${{ inputs.developer_space_id }}
    steps:
      - name: Check out the selected app branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_branch }}
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify required secrets and source branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SOURCE_BRANCH" != "codegeist/forge-foundation" ]]; then
            echo "::error title=Unexpected source branch::This development deployment workflow is restricted to codegeist/forge-foundation."
            exit 1
          fi
          if [[ -z "$FORGE_EMAIL" || -z "$FORGE_API_TOKEN" ]]; then
            echo "::error title=Forge credentials missing::Add FORGE_EMAIL and FORGE_API_TOKEN as GitHub Actions repository secrets before running this workflow."
            exit 1
          fi

      - name: Install app dependencies reproducibly
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Commit a lockfile only when this repository has none
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package-lock.json ]]; then
            npm install --package-lock-only
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: lock Forge dependencies"
            git push origin "HEAD:$SOURCE_BRANCH"
          fi

      - name: Disable interactive Forge CLI analytics prompt
        run: npx --yes @forge/cli@15.1.0 settings set usage-analytics false

      - name: Register the Forge app once if the manifest has no app ID
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^  id:' manifest.yml; then
            echo "An app ID already exists in manifest.yml; skipping registration."
          else
            if [[ "$CONFIRM_NO_EXISTING_REGISTRATION" != "true" ]]; then
              echo "::error title=Existing registration check required::Confirm this app has not already been registered outside this workflow. If it has, recover the existing app ID instead of registering again."
              exit 1
            fi
            if [[ "$ACCEPT_FORGE_TERMS" != "true" ]]; then
              echo "::error title=Forge terms confirmation required::The manifest has no app ID. Confirm Atlassian Forge terms before first-time registration."
              exit 1
            fi
            if [[ -n "$DEVELOPER_SPACE_ID" ]]; then
              npx --yes @forge/cli@15.1.0 register "TraceBack Context Engine" --developer-space-id "$DEVELOPER_SPACE_ID" --accept-terms
            else
              npx --yes @forge/cli@15.1.0 register "TraceBack Context Engine" --accept-terms
            fi
            if ! grep -Eq '^  id:' manifest.yml; then
              echo "::error title=Registration did not update manifest::Forge registration returned without writing app.id to manifest.yml."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.yml
            git commit -m "chore: register TraceBack Forge app"
            git push origin "HEAD:$SOURCE_BRANCH"
          fi

      - name: Validate Forge manifest and app source
        run: npx --yes @forge/cli@15.1.0 lint

      - name: Deploy to Forge development environment only
        run: npx --yes @forge/cli@15.1.0 deploy --non-interactive -e development

      - name: Confirm no Jira site installation is performed
        run: echo "Development environment deployment complete; this workflow does not install or upgrade the app on any Jira site."
