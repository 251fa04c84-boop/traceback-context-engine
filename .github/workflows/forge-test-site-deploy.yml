name: Forge staging deploy (no Jira site install)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/forge-test-site-deploy.yml
  workflow_dispatch:
    inputs:
      source_branch:
        description: Existing TraceBack app branch to deploy to the Forge staging environment
        required: true
        type: choice
        options:
          - codegeist/forge-foundation
          - codegeist/rovo-integrated
        default: codegeist/forge-foundation
      confirm_staging_deploy:
        description: I authorize deploying code to the Forge staging environment only; no site installation or upgrade will occur
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: traceback-forge-staging-test-site
  cancel-in-progress: false

jobs:
  validate-workflow-on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm GitHub accepted the workflow definition
        run: echo "Forge staging deployment workflow syntax was accepted by GitHub."

  deploy-to-staging:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      CONFIRM_STAGING_DEPLOY: ${{ inputs.confirm_staging_deploy }}
    steps:
      - name: Check out selected candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_branch }}
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify credentials, source branch and explicit staging confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FORGE_EMAIL" || -z "$FORGE_API_TOKEN" ]]; then
            echo "::error title=Forge credentials missing::Add FORGE_EMAIL and FORGE_API_TOKEN as repository Actions secrets."
            exit 1
          fi
          if [[ "$SOURCE_BRANCH" != "codegeist/forge-foundation" && "$SOURCE_BRANCH" != "codegeist/rovo-integrated" ]]; then
            echo "::error title=Unapproved source branch::Only the maintained core and reviewed Rovo/MCP candidate branches may be deployed to Forge staging."
            exit 1
          fi
          if [[ "$CONFIRM_STAGING_DEPLOY" != "true" ]]; then
            echo "::error title=Explicit staging deployment confirmation required::Confirm a Forge staging environment deployment before continuing."
            exit 1
          fi
          if ! grep -Eq '^  id:' manifest.yml; then
            echo "::error title=Forge app is not registered::The selected branch must contain the existing app.id. This workflow never registers or re-registers an app."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Run core test suite
        run: npm test

      - name: Run syntax checks
        run: npm run lint:syntax

      - name: Compile the frontend bundle
        run: npm run lint:frontend

      - name: Disable interactive Forge CLI analytics prompt
        run: npx --yes @forge/cli@15.1.0 settings set usage-analytics false

      - name: Validate Forge manifest and source
        run: npx --yes @forge/cli@15.1.0 lint

      - name: Deploy selected branch to the Forge staging environment only
        run: npx --yes @forge/cli@15.1.0 deploy --non-interactive -e staging

      - name: Confirm no Jira or Confluence site installation is performed
        run: echo "Forge staging deployment complete; this workflow does not install or upgrade the app on any site or approve scopes."
