name: Forge test-site deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/forge-test-site-deploy.yml
  workflow_dispatch:
    inputs:
      source_branch:
        description: App branch to deploy to the isolated staging environment
        required: true
        type: choice
        options:
          - codegeist/forge-foundation
        default: codegeist/forge-foundation
      target_site:
        description: Exact connected staging tenant only
        required: true
        type: choice
        options:
          - brand7.atlassian.net
        default: brand7.atlassian.net
      confirm_test_site_install:
        description: I confirm this is a separate free developer/test site, not a customer or production site
        required: true
        type: boolean
        default: false
      confirm_not_production_site:
        description: I confirm this is not 251fa04c84.atlassian.net
        required: true
        type: boolean
        default: false
      install_mode:
        description: Install for first-time setup, or upgrade an existing staging install
        required: true
        type: choice
        options:
          - install
          - upgrade
        default: install

permissions:
  contents: read

concurrency:
  group: traceback-forge-staging-test-site
  cancel-in-progress: false

jobs:
  validate-workflow-on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm GitHub accepted the workflow definition
        run: echo "Forge test-site deployment workflow syntax was accepted by GitHub."

  deploy-to-test-site:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      TARGET_SITE: ${{ inputs.target_site }}
      CONFIRM_TEST_SITE_INSTALL: ${{ inputs.confirm_test_site_install }}
      CONFIRM_NOT_PRODUCTION_SITE: ${{ inputs.confirm_not_production_site }}
      INSTALL_MODE: ${{ inputs.install_mode }}
    steps:
      - name: Check out selected candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_branch }}
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify credentials, site safety and explicit confirmations
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FORGE_EMAIL" || -z "$FORGE_API_TOKEN" ]]; then
            echo "::error title=Forge credentials missing::Add FORGE_EMAIL and FORGE_API_TOKEN as repository Actions secrets."
            exit 1
          fi
          if [[ ! "$TARGET_SITE" =~ ^[a-z0-9][a-z0-9-]*\.atlassian\.net$ ]]; then
            echo "::error title=Invalid target site::Enter only a site domain such as example.atlassian.net; do not include https:// or a path."
            exit 1
          fi
          if [[ "$TARGET_SITE" == "251fa04c84.atlassian.net" ]]; then
            echo "::error title=Production tenant blocked::This workflow cannot install to the connected production Jira tenant."
            exit 1
          fi
          if [[ "$TARGET_SITE" != "brand7.atlassian.net" ]]; then
            echo "::error title=Unapproved staging target::This workflow is restricted to the connected staging tenant brand7.atlassian.net."
            exit 1
          fi
          if [[ "$CONFIRM_TEST_SITE_INSTALL" != "true" || "$CONFIRM_NOT_PRODUCTION_SITE" != "true" ]]; then
            echo "::error title=Explicit test-site confirmation required::Confirm both test-site and non-production-site checkboxes before continuing."
            exit 1
          fi
          if ! grep -Eq '^  id:' manifest.yml; then
            echo "::error title=Forge app is not registered::The selected branch must contain the existing app.id. This workflow never registers or re-registers an app."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Run core test suite
        run: npm test

      - name: Run syntax checks
        run: npm run lint:syntax

      - name: Compile the frontend bundle
        run: npm run lint:frontend

      - name: Disable interactive Forge CLI analytics prompt
        run: npx --yes @forge/cli@15.1.0 settings set usage-analytics false

      - name: Validate Forge manifest and source
        run: npx --yes @forge/cli@15.1.0 lint

      - name: Deploy selected branch to isolated Forge staging environment
        run: npx --yes @forge/cli@15.1.0 deploy --non-interactive -e staging

      - name: Install to the separate developer site without automatic scope consent
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INSTALL_MODE" == "upgrade" ]]; then
            npx --yes @forge/cli@15.1.0 install --site "$TARGET_SITE" --product jira --non-interactive --upgrade all -e staging
          else
            npx --yes @forge/cli@15.1.0 install --site "$TARGET_SITE" --product jira --non-interactive -e staging
          fi
          echo "Installed the selected branch to $TARGET_SITE in the Forge staging environment."
          echo "No --confirm-scopes flag was used. Any Teamwork Graph scope approval remains an explicit administrator action."
