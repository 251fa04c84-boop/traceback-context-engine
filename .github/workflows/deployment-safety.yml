name: Deployment safety checks

on:
  pull_request:
    paths:
      - .github/workflows/forge-dev-deploy.yml
      - .github/workflows/forge-test-site-deploy.yml
      - .github/scripts/assert-deployment-safety.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/forge-dev-deploy.yml
      - .github/workflows/forge-test-site-deploy.yml
      - .github/scripts/assert-deployment-safety.sh

permissions:
  contents: read

jobs:
  assert-deployment-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert development and staging boundaries
        shell: bash
        run: bash .github/scripts/assert-deployment-safety.sh
