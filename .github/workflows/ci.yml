name: CI

on:
  push:
    branches: [main, "codegeist/**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run lint:syntax
      - name: Disable interactive Forge CLI analytics prompt
        run: npx --yes @forge/cli@15.1.0 settings set usage-analytics false
      - name: Validate Forge app manifest and source
        run: npx --yes @forge/cli@15.1.0 lint
